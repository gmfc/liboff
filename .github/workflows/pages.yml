name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on through the API on the first run.
      # Without it the workflow fails with "Get Pages site failed" until
      # somebody flips the setting by hand — a deploy that cannot deploy until
      # a human reads the log is not much of a deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # There is no build step: the repository *is* the site. Only the files
      # the app needs at runtime are uploaded.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets src vendor _site/
          # Keep Jekyll from swallowing anything and skipping the upload.
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
